// a root as its letter, the spelling stepped by tapping the letter again; ok(l, a) says which spellings exist (R42)

}

      micOn: mic, micOff: !mic, allow: () => set({ mic: true }), a4L: a4 + ' Hz', aDn: () => set({ a4: a4 - 1 }), aUp: () => set({ a4: a4 + 1 }), noteT: quiet ? '–' : 'A', noteC: quiet ? '#453E38' : '#EDE9E1', subV: quiet ? 'hidden' : 'visible', ...(quiet ? { needle: 'rotate(0 160 170)', nc: '#453E38', state: 'Listening', sc: '#BBB3A8', hz: ' ' } : {}) };
  }
}


{ const R = Component.prototype.renderVals; Component.prototype.renderVals = function () {

}; }
