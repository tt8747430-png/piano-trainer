function letterPick(rl, ra, ok, tapUsed, pick) {
  const L7 = 'CDEFGAB', A7 = { '0': '', '1': '♯', '-1': '♭' }, NM = { '0': '', '1': ' sharp', '-1': ' flat' };
  const waysOf = (l) => [0, 1, -1].filter((a) => ok(l, a));
  const w0 = waysOf(rl); let rootHint = { on: false, t: '', box: '', tip: '' };
