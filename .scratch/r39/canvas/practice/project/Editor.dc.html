// a keyboard from lo to hi, W×H px; marks: midi -> [colour, label]
function calmKeys(lo, hi, marks, W, H) {
  const ws = []; for (let m = lo; m <= hi; m++) if (NAT.includes(m % 12)) ws.push(m);
