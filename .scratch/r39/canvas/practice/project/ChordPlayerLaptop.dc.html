      bpm: bpm + ' BPM', bpmDown: () => set({ bpm: bpm - 2 }), bpmUp: () => set({ bpm: bpm + 2 }), loop: !!st.loop, loopBg: st.loop ? C.accent : C.fill, toggleLoop: () => set({ loop: !st.loop }), pillBg: C.fill };
