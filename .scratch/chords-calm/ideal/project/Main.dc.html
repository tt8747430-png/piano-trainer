<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chords on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,300..600&amp;family=Noto+Music&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 402px; height: 874px; overflow: hidden; background: {{c.page}}; color: {{c.ink}}; font-family: 'Instrument Sans', 'Noto Music', system-ui, sans-serif">

  <div style="position: absolute; left: 20px; right: 20px; top: 62px; display: flex; align-items: center; gap: 12px; height: 44px">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 22px; background: {{c.surface}}; color: {{c.ink}}; display: grid; place-items: center"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
    <div style="flex: 1; font-size: 17px; font-weight: 600">Chords</div>
    <button type="button" aria-label="Tools" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 22px; background: {{c.surface}}; color: {{c.ink}}; display: grid; place-items: center"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg></button>
  </div>

  <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 20px; right: 20px; top: 114px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 100px; gap: 8px">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <div style="font-family: Fraunces, 'Noto Music', Georgia, serif; font-size: {{nameSize}}px; line-height: 60px; height: 60px; white-space: nowrap">{{symbol}}</div>
          <div style="font-size: 15px; font-weight: 600; line-height: 19px">{{fullName}}</div>
          <div style="font-size: 13px; line-height: 17px; color: {{c.dim}}">{{noteLine}}</div>
        </div>
        <div style="position: relative; flex: none; width: 150px; height: 100px">
          <svg viewBox="0 0 150 100" width="150" height="100" aria-hidden="true" style="position: absolute; left: 0; top: 0">
            <path d="M2 38H148M2 46H148M2 54H148M2 62H148M2 70H148" stroke="{{c.staff}}" stroke-width="1"></path>
            <text x="4" y="72" font-family="'Noto Music', serif" font-size="42" fill="{{c.ink}}">𝄞</text>
          </svg>
          <sc-for list="{{ledgers}}" as="l" hint-placeholder-count="1">
            <div style="position: absolute; left: {{l.x}}px; top: {{l.y}}px; width: 22px; height: 1px; background: {{c.staff}}"></div>
          </sc-for>
          <sc-for list="{{staffNotes}}" as="n" hint-placeholder-count="3">
            <div style="position: absolute; left: {{n.x}}px; top: {{n.y}}px; width: 12px; height: 8px; border-radius: 50%; transform: rotate(-18deg); background: {{n.color}}"></div>
          </sc-for>
          <sc-for list="{{staffSigns}}" as="n" hint-placeholder-count="0">
            <div style="position: absolute; left: {{n.x}}px; top: {{n.y}}px; font-family: 'Noto Music', serif; font-size: 13px; line-height: 14px; color: {{c.ink}}">{{n.sign}}</div>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; gap: 6px; height: 48px">
        <sc-for list="{{inversions}}" as="v" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{v.chosen}}" onClick="{{v.pick}}" style="flex: 1; min-width: 0; padding: 0; border: 0; border-radius: 12px; background: {{v.bg}}; color: {{v.ink}}; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15">
            <span style="font-size: 11px; font-weight: 500">{{v.label}}</span>
            <span style="font-family: Fraunces, 'Noto Music', Georgia, serif; font-size: 15px; font-weight: 500; white-space: nowrap">{{v.symbol}}</span>
          </button>
        </sc-for>
      </div>

      <div role="group" aria-label="Root" style="position: relative; height: 94px">
        <sc-for list="{{rootKeys}}" as="k" hint-placeholder-count="12">
          <button type="button" aria-pressed="{{k.chosen}}" onClick="{{k.pick}}" style="position: absolute; left: {{k.left}}px; top: {{k.top}}px; width: {{k.w}}px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: {{k.bg}}; color: {{k.ink}}; font-family: Fraunces, 'Noto Music', Georgia, serif; font-size: 17px; font-weight: 500">{{k.name}}</button>
        </sc-for>
        <button type="button" aria-label="Spell black keys with {{otherSpelling}}" onClick="{{flip}}" style="position: absolute; left: {{flipLeft}}px; top: 0; width: {{keyStep}}px; height: 44px; box-sizing: border-box; padding: 0; border: 1px solid {{c.line}}; border-radius: 12px; background: transparent; color: {{c.ink}}; font-family: 'Noto Music', serif; font-size: 15px">{{spellingLabel}}</button>
      </div>

      <div role="tablist" aria-label="Chord family" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 44px; box-sizing: border-box; padding: 3px; border-radius: 14px; background: {{c.chip}}">
        <sc-for list="{{families}}" as="f" hint-placeholder-count="5">
          <button type="button" role="tab" aria-selected="{{f.chosen}}" onClick="{{f.pick}}" style="padding: 0; border: 0; border-radius: 11px; background: {{f.bg}}; color: {{f.ink}}; font-family: inherit; font-size: 14px; font-weight: 600">{{f.name}}</button>
        </sc-for>
      </div>

      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="7">
          <button type="button" aria-pressed="{{t.chosen}}" aria-label="{{t.full}}" onClick="{{t.pick}}" style="height: 44px; padding: 0; border: 0; border-radius: 12px; background: {{t.bg}}; color: {{t.ink}}; font-family: Fraunces, 'Noto Music', Georgia, serif; font-size: 15px; font-weight: 500; white-space: nowrap">{{t.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="position: absolute; left: 8px; right: 8px; bottom: 8px; height: 212px; box-sizing: border-box; padding: 0 12px 13px; border-radius: {{panelRadius}}px; background: #141210; border: 1px solid rgba(255,255,255,.1); box-shadow: 0 -10px 40px rgba(0,0,0,.28); color: #F4EFE6; display: flex; flex-direction: column">
      <button type="button" aria-label="Fold the keys" onClick="{{toggleFold}}" style="flex: none; height: 20px; padding: 0; border: 0; background: transparent; display: grid; place-items: center"><span style="display: block; width: 36px; height: 4px; border-radius: 2px; background: rgba(244,239,230,.3)"></span></button>
      <div role="toolbar" aria-label="Transport" style="flex: none; height: 52px; display: flex; gap: 8px">
        <button type="button" aria-pressed="{{chordOn}}" onClick="{{play}}" style="flex: 1; min-width: 0; padding: 0; border: 0; border-radius: 26px; background: {{playBg}}; color: {{playInk}}; font-family: inherit; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
          <sc-if value="{{chordOn}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5"></rect></svg></sc-if>
          <sc-if value="{{chordOff}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M7 4.8a1.6 1.6 0 0 1 2.4-1.4l11 6.8a2.1 2.1 0 0 1 0 3.6l-11 6.8A1.6 1.6 0 0 1 7 19.2z"></path></svg></sc-if>
          {{playLabel}}
        </button>
        <button type="button" aria-pressed="{{arpOn}}" onClick="{{arpeggio}}" style="flex: 1; min-width: 0; padding: 0; border: 0; border-radius: 26px; background: {{arpBg}}; color: {{arpInk}}; font-family: inherit; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="19" r="2"></circle><path d="M7 19V12"></path><circle cx="12" cy="14" r="2"></circle><path d="M14 14V7"></path><circle cx="19" cy="9" r="2"></circle><path d="M21 9V2"></path></svg>
          {{arpLabel}}
        </button>
        <button type="button" aria-label="Sustain pedal" aria-pressed="false" style="flex: none; width: 52px; height: 52px; padding: 0; border: 0; border-radius: 26px; background: #2A2622; color: #F4EFE6; display: grid; place-items: center"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v7"></path><path d="M8 10h8l2 7H6z"></path><path d="M5 21h14"></path></svg></button>
      </div>
      <div style="flex: none; height: 14px; display: flex; align-items: center">
        <div style="position: relative; width: 100%; height: 4px; border-radius: 2px; background: #2A2622">
          <div style="position: absolute; left: {{windowLeft}}%; top: 0; width: 27%; height: 4px; border-radius: 2px; background: {{accent}}"></div>
        </div>
      </div>
      <div style="flex: none; height: 3px; background: #7A1C1C"></div>
      <div style="position: relative; flex: 1; border-radius: 0 0 {{keysRadius}}px {{keysRadius}}px; overflow: hidden; background: #0A0908">
        <sc-for list="{{whites}}" as="k" hint-placeholder-count="15">
          <button type="button" aria-label="{{k.name}}" style="position: absolute; left: {{k.left}}px; top: {{k.top}}px; width: {{k.w}}px; height: 112px; box-sizing: border-box; padding: 0 0 8px; border: 0; border-right: 1px solid #B8B0A2; background: {{k.bg}}; color: #15120E; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; line-height: 1.1">
            <span style="font-size: 12px; font-weight: 700; white-space: nowrap">{{k.degree}}</span>
            <span style="font-size: 10px; font-weight: 600; white-space: nowrap">{{k.note}}</span>
          </button>
        </sc-for>
        <sc-for list="{{blacks}}" as="k" hint-placeholder-count="10">
          <button type="button" aria-label="{{k.name}}" style="position: absolute; left: {{k.left}}px; top: 0; width: 15px; height: 62px; box-sizing: border-box; padding: 0 0 3px; border: 0; border-radius: 0 0 4px 4px; background: {{k.bg}}; box-shadow: 0 2px 3px rgba(0,0,0,.5); color: #15120E; font-family: inherit; font-size: 9px; font-weight: 700; display: flex; align-items: flex-end; justify-content: center">{{k.degree}}</button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{folded}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 20px; right: 20px; top: 118px; display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; font-family: Fraunces, 'Noto Music', Georgia, serif; font-size: 34px; font-weight: 400; line-height: 40px">Fingering</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="box-sizing: border-box; padding: 14px; border-radius: 18px; background: {{c.surface}}; display: flex; flex-direction: column; gap: 10px">
          <div style="font-size: 15px; font-weight: 600">Left hand</div>
          <div style="display: grid; grid-template-columns: 44px repeat(3, minmax(0, 1fr)); row-gap: 6px; font-size: 15px; font-weight: 600; text-align: center">
            <span style="text-align: left; color: {{c.dim}}; font-weight: 500">Root</span><span>5</span><span>3</span><span>1</span>
            <span style="text-align: left; color: {{c.dim}}; font-weight: 500">1st</span><span>5</span><span>3</span><span>1</span>
            <span style="text-align: left; color: {{c.dim}}; font-weight: 500">2nd</span><span>5</span><span>2</span><span>1</span>
          </div>
        </div>
        <div style="box-sizing: border-box; padding: 14px; border-radius: 18px; background: {{c.surface}}; display: flex; flex-direction: column; gap: 10px">
          <div style="font-size: 15px; font-weight: 600">Right hand</div>
          <div style="display: grid; grid-template-columns: 44px repeat(3, minmax(0, 1fr)); row-gap: 6px; font-size: 15px; font-weight: 600; text-align: center">
            <span style="text-align: left; color: {{c.dim}}; font-weight: 500">Root</span><span>1</span><span>3</span><span>5</span>
            <span style="text-align: left; color: {{c.dim}}; font-weight: 500">1st</span><span>1</span><span>2</span><span>5</span>
            <span style="text-align: left; color: {{c.dim}}; font-weight: 500">2nd</span><span>1</span><span>3</span><span>5</span>
          </div>
        </div>
      </div>
      <h2 style="margin: 12px 0 0; font-family: Fraunces, 'Noto Music', Georgia, serif; font-size: 34px; font-weight: 400; line-height: 40px">Colour notes</h2>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 13px; font-weight: 500; color: {{c.dim}}">Chord tones</div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{toneChips}}" as="t" hint-placeholder-count="3">
            <button type="button" style="height: 44px; min-width: 56px; padding: 0 14px; border: 0; border-radius: 22px; background: {{t.bg}}; color: #15120E; font-family: inherit; font-size: 15px; font-weight: 600">{{t.text}}</button>
          </sc-for>
        </div>
        <div style="margin-top: 6px; font-size: 13px; font-weight: 500; color: {{c.dim}}">Tensions</div>
        <div style="display: flex; gap: 8px">
          <button type="button" style="height: 44px; min-width: 56px; padding: 0 14px; border: 0; border-radius: 22px; background: {{c.chip}}; color: {{c.ink}}; font-family: inherit; font-size: 15px; font-weight: 500">D · 9</button>
          <button type="button" style="height: 44px; min-width: 56px; padding: 0 14px; border: 0; border-radius: 22px; background: {{c.chip}}; color: {{c.ink}}; font-family: inherit; font-size: 15px; font-weight: 500">F♯ · ♯11</button>
          <button type="button" style="height: 44px; min-width: 56px; padding: 0 14px; border: 0; border-radius: 22px; background: {{c.chip}}; color: {{c.ink}}; font-family: inherit; font-size: 15px; font-weight: 500">A · 13</button>
        </div>
      </div>
    </div>

    <div role="toolbar" aria-label="Transport" style="position: absolute; left: 12px; right: 12px; bottom: 24px; height: 72px; box-sizing: border-box; padding: 0 8px 0 22px; border-radius: 36px; background: #141210; border: 1px solid rgba(255,255,255,.1); box-shadow: 0 14px 34px rgba(0,0,0,.42); color: #F4EFE6; display: flex; align-items: center; gap: 8px">
      <div style="flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; overflow: hidden; white-space: nowrap">
        <span style="font-family: Fraunces, 'Noto Music', Georgia, serif; font-size: 28px; line-height: 40px">{{symbol}}</span>
        <span style="font-size: 14px; font-weight: 500; color: #ADA598; overflow: hidden; text-overflow: ellipsis">{{fullName}}</span>
      </div>
      <button type="button" aria-label="Play" onClick="{{play}}" style="flex: none; width: 56px; height: 56px; padding: 0; border: 0; border-radius: 28px; background: {{accent}}; color: #1A1306; display: grid; place-items: center"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M7 4.8a1.6 1.6 0 0 1 2.4-1.4l11 6.8a2.1 2.1 0 0 1 0 3.6l-11 6.8A1.6 1.6 0 0 1 7 19.2z"></path></svg></button>
      <button type="button" aria-label="Arpeggio" onClick="{{arpeggio}}" style="flex: none; width: 56px; height: 56px; padding: 0; border: 0; border-radius: 28px; background: #2A2622; color: #F4EFE6; display: grid; place-items: center"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="19" r="2"></circle><path d="M7 19V12"></path><circle cx="12" cy="14" r="2"></circle><path d="M14 14V7"></path><circle cx="19" cy="9" r="2"></circle><path d="M21 9V2"></path></svg></button>
      <button type="button" aria-label="Open the keys" onClick="{{toggleFold}}" style="flex: none; width: 44px; height: 56px; padding: 0; border: 0; background: transparent; color: #F4EFE6; display: grid; place-items: center"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","options":["rest","chord","arpeggio","folded"],"default":"rest","section":"State"},"theme":{"editor":"enum","options":["lacquer","ivory"],"default":"lacquer","section":"Look"},"accent":{"editor":"color","options":["#E2AC45","#EE7A4F","#58C2B2"],"default":"#E2AC45","section":"Look"},"panelRadius":{"editor":"range","min":24,"max":54,"step":2,"default":54,"unit":"px","section":"Look"},"root":{"editor":null},"flats":{"editor":null},"family":{"editor":null},"chord":{"editor":null},"$preview":{"width":402,"height":874}}'>

  ['Dominant', [

    ['7♯9', '7♯9', '1 3 5 b7 #9', 'Seventh, sharp nine'], ['7♯11', '7♯11', '1 3 5 b7 #11', 'Seventh, sharp eleven'], ['7♭5♯9', '7♭5♯9', '1 3 b5 b7 #9', 'Seventh, flat five, sharp nine'],

];
const LETTERS = 'CDEFGAB';
const NATURAL = [0, 2, 4, 5, 7, 9, 11];
const SHARP_NAMES = [[0, 0], [0, 1], [1, 0], [1, 1], [2, 0], [3, 0], [3, 1], [4, 0], [4, 1], [5, 0], [5, 1], [6, 0]];
const FLAT_NAMES = [[0, 0], [1, -1], [1, 0], [2, -1], [2, 0], [3, 0], [4, -1], [4, 0], [5, -1], [5, 0], [6, -1], [6, 0]];
const SIGN = { '-2': '𝄫', '-1': '♭', 0: '', 1: '♯', 2: '𝄪' };
const TONE = {
  1: ['#F4DFB2', null], 3: ['#CFE6F6', '#8CC4EC'], 5: ['#D8EED4', '#A6D9A0'], 7: ['#E3DAF4', '#BBA9E0'],
  2: ['#F7D9D5', '#EBA6A0'], 9: ['#F7D9D5', '#EBA6A0'], 4: ['#EFDFCE', '#D8B48F'], 11: ['#EFDFCE', '#D8B48F'],

  const tones = formula.split(' ').map((token) => {
    const number = Number(token.replace(/[b#]/g, ''));
    const shift = (token.match(/#/g) || []).length - (token.match(/b/g) || []).length;
    const semis = NATURAL[(number - 1) % 7] + 12 * Math.floor((number - 1) / 7) + shift;
    const letter = (rootLetter + number - 1) % 7;
    const pc = (rootPc + semis) % 12;
    const sign = ((pc - NATURAL[letter] + 18) % 12) - 6;
    return { number, degree: token.replace(/b/g, '♭').replace(/#/g, '♯'), semis, letter, sign, name: spell(letter, sign) };
  }).sort((a, b) => a.semis - b.semis);
  return tones
    .map((tone, i) => ({ ...tone, pitch: 60 + rootPc + tone.semis + (i < inversion ? 12 : 0) }))
    .sort((a, b) => a.pitch - b.pitch);
}
    return { FAMILIES, LETTERS, NATURAL, SHARP_NAMES, FLAT_NAMES, SIGN, TONE, spell, buildChord };
  }
  componentWillUnmount() {
    this.stopTimers();
  }
  stopTimers() {
    clearTimeout(this.timer);
    clearInterval(this.ticker);
  }
  renderVals() {
    const { FAMILIES, LETTERS, NATURAL, SHARP_NAMES, FLAT_NAMES, SIGN, TONE, spell, buildChord } = this.music();
    const s = this.state || {};
    const view = this.props.view ?? 'rest';
    const accent = this.props.accent ?? '#E2AC45';
    const panelRadius = this.props.panelRadius ?? 54;
    const ivory = (this.props.theme ?? 'lacquer') === 'ivory';
    const c = ivory
      ? { page: '#F5F1E8', surface: '#FFFFFF', chip: '#E9E3D6', ink: '#15120E', dim: '#5F584E', staff: '#8B8377', line: 'rgba(21,18,14,.2)', white: '#FFFFFF', black: '#2A2622', blackInk: '#F4EFE6' }
      : { page: '#0F0E0C', surface: '#1E1B18', chip: '#26231F', ink: '#F4EFE6', dim: '#ADA598', staff: '#6F685E', line: 'rgba(244,239,230,.2)', white: '#EFE9DD', black: '#34302B', blackInk: '#F4EFE6' };
    const inverse = { bg: c.ink, ink: c.page };
    const plain = { bg: c.chip, ink: c.ink };

    const rootPc = s.root ?? Number(this.props.root ?? 0);
    const flats = s.flats ?? (this.props.flats === true || this.props.flats === 'true');
    const familyAt = s.family ?? Number(this.props.family ?? 0);
    const chordKey = s.chord ?? this.props.chord ?? 'maj';
    const inversionWanted = s.inversion ?? 0;
    const type = FAMILIES.flatMap(([, list]) => list).find((each) => each[0] === chordKey);
    const rootName = spell(...(flats ? FLAT_NAMES : SHARP_NAMES)[rootPc]);
    const count = type[2].split(' ').length;
    const inversionCount = Math.min(count, 4);
    const inversion = Math.min(inversionWanted, inversionCount - 1);
    const tones = buildChord(rootPc, flats, type[2], inversion);
    const symbol = rootName + type[1];
    const ordered = buildChord(rootPc, flats, type[2], 0);

    const folded = s.folded ?? view === 'folded';
    const mode = s.mode ?? (view === 'folded' ? 'rest' : view);
    const step = s.step ?? 1;
    const chordOn = mode === 'chord';
    const arpOn = mode === 'arpeggio';
    const change = (next) => {
      this.stopTimers();
      this.setState({ mode: 'rest', step: 0, ...next });
    };

    const inversions = Array.from({ length: inversionCount }, (_, i) => ({
      label: ['Root', '1st', '2nd', '3rd'][i],
      symbol: i === 0 ? symbol : `${symbol}/${ordered[i].name}`,
      chosen: i === inversion,
      bg: i === inversion ? inverse.bg : plain.bg,
      ink: i === inversion ? inverse.ink : plain.ink,
      pick: () => change({ inversion: i }),
    }));

    const gap = 6;
    const keyStep = (362 - gap * 6) / 7;
    const names = flats ? FLAT_NAMES : SHARP_NAMES;
    const rootKeys = names.map(([letter, sign], pc) => {
      const white = sign === 0;
      const chosen = pc === rootPc;
      const column = white ? letter : letter - (sign === 1 ? 0 : 1);
      return {
        name: spell(letter, sign),
        left: white ? column * (keyStep + gap) : column * (keyStep + gap) + (keyStep + gap) / 2,
        top: white ? 50 : 0,
        w: keyStep,
        chosen,
        bg: chosen ? accent : white ? c.white : c.black,
        ink: chosen || white ? '#15120E' : c.blackInk,
        pick: () => change({ root: pc }),
      };
    });

    const families = FAMILIES.map(([name], i) => ({
      name,
      chosen: i === familyAt,
      bg: i === familyAt ? inverse.bg : 'transparent',
      ink: i === familyAt ? inverse.ink : c.ink,
      pick: () => this.setState({ family: i }),
    }));
    const types = FAMILIES[familyAt][1].map(([key, , , full]) => ({
      label: key,
      full,
      chosen: key === chordKey,
      bg: key === chordKey ? accent : plain.bg,
      ink: key === chordKey ? '#15120E' : plain.ink,
      pick: () => change({ chord: key }),
    }));

    const toneFill = (tone, full) => {
      const pair = TONE[tone.number] ?? TONE[7];
      if (!full) return pair[0];
      return pair[1] ?? accent;
    };
    const sounding = (at) => chordOn || (arpOn && at <= step);

    const startPc = rootPc - (names[rootPc][1] === 0 ? 0 : names[rootPc][1] === 1 ? 1 : 1);
    let startPitch = 60 + startPc - 1;
    while (!NATURAL.includes(startPitch % 12)) startPitch -= 1;
    const whitePitches = [];
    for (let p = startPitch; whitePitches.length < 15; p += 1) {
      if (NATURAL.includes(p % 12)) whitePitches.push(p);
    }
    const keyW = 360 / 15;
    const byPitch = new Map(tones.map((tone, at) => [tone.pitch, { tone, at }]));
    const whites = whitePitches.map((pitch, i) => {
      const hit = byPitch.get(pitch);
      const down = hit && sounding(hit.at);
      return {
        name: `${LETTERS[NATURAL.indexOf(pitch % 12)]}${Math.floor(pitch / 12) - 1}`,
        left: i * keyW,
        w: keyW,
        top: down ? 2 : 0,
        bg: hit ? toneFill(hit.tone, down) : '#F2ECE1',
        degree: hit ? hit.tone.degree : '',
        note: hit ? hit.tone.name : '',
      };
    });
    const blacks = [];
    whitePitches.forEach((pitch, i) => {
      const next = pitch + 1;
      if (i < 14 && !NATURAL.includes(next % 12)) {
        const hit = byPitch.get(next);
        const down = hit && sounding(hit.at);
        blacks.push({
          name: `Key ${next}`,
          left: (i + 1) * keyW - 7.5,
          bg: hit ? toneFill(hit.tone, true) : '#1F1C19',
          degree: hit ? hit.tone.degree : '',
        });
      }
    });

    const staffNotes = [];
    const staffSigns = [];
    const ledgerSteps = new Set();
    let lastStep = null;
    let shifted = false;
    tones.forEach((tone, i) => {
      const octave = Math.floor((tone.pitch - tone.sign) / 12) - 1;
      const stepUp = tone.letter + octave * 7 - (2 + 4 * 7);
      shifted = lastStep !== null && stepUp - lastStep === 1 && !shifted;
      lastStep = stepUp;
      const x = 74 + (shifted ? 12 : 0);
      const y = 70 - stepUp * 4;
      staffNotes.push({ x, y: y - 4, color: TONE[tone.number]?.[1] ?? accent });
      if (tone.sign !== 0) staffSigns.push({ x: 60 - (i % 2) * 11, y: y - 8, sign: SIGN[tone.sign] });
      if (stepUp <= -2) for (let at = -2; at >= stepUp; at -= 2) ledgerSteps.add(`${at}:${x}`);
      if (stepUp >= 10) for (let at = 10; at <= stepUp; at += 2) ledgerSteps.add(`${at}:${x}`);
    });
    const ledgers = [...ledgerSteps].map((key) => {
      const [at, x] = key.split(':').map(Number);
      return { x: x - 5, y: 70 - at * 4 };
    });

    const play = () => {
      this.stopTimers();
      if (mode === 'chord') {
        this.setState({ mode: 'rest', step: 0 });
        return;
      }
      this.setState({ mode: 'chord', step: 0 });
      this.timer = setTimeout(() => this.setState({ mode: 'rest', step: 0 }), 1800);
    };
    const arpeggio = () => {
      this.stopTimers();
      if (mode === 'arpeggio') {
        this.setState({ mode: 'rest', step: 0 });
        return;
      }
      let at = 0;
      this.setState({ mode: 'arpeggio', step: at });
      this.ticker = setInterval(() => {
        at += 1;
        if (at >= tones.length) {
          clearInterval(this.ticker);
          this.timer = setTimeout(() => this.setState({ mode: 'rest', step: 0 }), 900);
          return;
        }
        this.setState({ mode: 'arpeggio', step: at });
      }, 340);
    };

    return {
      c,
      accent,
      panelRadius,
      keysRadius: Math.max(panelRadius - 13, 8),
      symbol,
      fullName: type[3],
      noteLine: ordered.map((tone) => tone.name).join(' · '),
      nameSize: symbol.length <= 3 ? 64 : symbol.length <= 5 ? 48 : symbol.length <= 7 ? 36 : 28,
      inversions,
      rootKeys,
      keyStep,
      flipLeft: 2 * (keyStep + gap) + (keyStep + gap) / 2,
      spellingLabel: flats ? '♭ → ♯' : '♯ → ♭',
      otherSpelling: flats ? 'sharps' : 'flats',
      flip: () => this.setState({ flats: !flats }),
      families,
      types,
      whites,
      blacks,
      staffNotes,
      staffSigns,
      ledgers,
      toneChips: ordered.map((tone) => ({ text: `${tone.name} · ${tone.degree}`, bg: toneFill(tone, true) })),
      windowLeft: ((startPitch - 21) / 87) * 100,
      open: !folded,
      folded,
      chordOn,
      chordOff: !chordOn,
      arpOn,
      play,
      arpeggio,
      toggleFold: () => this.setState({ folded: !folded }),
      playLabel: chordOn ? 'Stop' : 'Play',
      arpLabel: arpOn ? 'Stop' : 'Arpeggio',
      playBg: arpOn ? '#2A2622' : accent,
      playInk: arpOn ? '#F4EFE6' : '#1A1306',
      arpBg: arpOn ? accent : '#2A2622',
      arpInk: arpOn ? '#1A1306' : '#F4EFE6',
    };
  }
}
</script>
</body>
