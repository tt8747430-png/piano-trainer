    <!-- The installed app, to Android and to iOS (which still reads only its own spelling), under a
       black status bar: the web view starts below it, so no inset is needed at the top. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Piano" />
    <title>Piano Trainer</title>
    <script id="theme-boot">
      ;(function () {
        // Paint the saved theme before first paint, so a dark-mode learner never sees a white
        // flash. Mirrors resolveTheme (src/entities/settings/model/resolve-theme.ts) and reads what
        // createSettingsStore saves under 'pt-settings', at SETTINGS_VERSION: a save of another
        // version the store discards, so this does too. src/app/theme-boot.test.ts holds them.
        var theme = 'system'
        try {
          var saved = JSON.parse(localStorage.getItem('pt-settings') || 'null')
          var chosen = saved && saved.version === 15 && saved.state && saved.state.theme
          if (chosen === 'light' || chosen === 'dark') theme = chosen
          // Small titles too, so a screen's title never jumps a size as the app starts (TitlesSync).
          if (saved && saved.version === 15 && saved.state && saved.state.titles === 'small')
            document.documentElement.dataset.titles = 'small'
        } catch (_) {}
        if (theme === 'system') {
          try {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          } catch (_) {
            theme = 'light'
          }
        }
        document.documentElement.dataset.theme = theme
        // The browser toolbar takes the same theme's colour: the build writes one theme-color per
        // OS scheme ahead of this script, and ThemeProvider keeps them once the app runs.
        var metas = document.querySelectorAll('meta[name="theme-color"]')
        var painted = document.querySelector(
          'meta[name="theme-color"][media="(prefers-color-scheme: ' + theme + ')"]',
        )
        if (painted) for (var i = 0; i < metas.length; i++) metas[i].content = painted.content
      })()
    </script>
    <script id="standalone-boot">
      ;(function () {
        // The installed app is an app: no pinch or double-tap zoom, which fights the keys and the
        // swipes. A browser tab keeps its zoom. src/app/standalone-boot.test.ts holds this.
        try {
          var installed =
            window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: fullscreen)').matches ||
            window.navigator.standalone === true
          var viewport = document.querySelector('meta[name="viewport"]')
          if (installed && viewport)
            viewport.content = viewport.content + ', maximum-scale=1, user-scalable=no'
          // Nor a long press's menu, a selection's loupe or Safari's own pinch: only fields keep theirs.
          if (installed) {
            var field = function (target) {
              return (
                target instanceof Element &&
                target.closest('input, textarea, [contenteditable]') !== null
              )
            }
            var hold = function (event) {
              if (!field(event.target)) event.preventDefault()
            }
            document.addEventListener('contextmenu', hold)
            document.addEventListener('selectstart', hold)
            document.addEventListener('gesturestart', hold)
          }
        } catch (_) {}
      })()
    </script>
