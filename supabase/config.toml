# The piano-trainer project (ADR 0116); which hosted project it is lives in the owner's settings, not here.
project_id = "piano-trainer"

# Both check their caller themselves: a learner's token, or the project's secret key from the
# daily purge job.
[functions.request-account-deletion]
verify_jwt = false

[functions.purge-account]
verify_jwt = false

[functions.admin]
verify_jwt = false
